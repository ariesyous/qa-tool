[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "local-qa-narrator"
version = "0.5.1"
description = "Local Windows audio walkthroughs with synchronized screenshot Markdown"
requires-python = ">=3.12,<3.14"
dependencies = [
  "PySide6>=6.8,<7",
  "sounddevice>=0.5,<0.6",
  "faster-whisper>=1.1,<2",
  # PyAV 19 removed metadata_errors, still used by faster-whisper 1.2.
  "av>=15,<17",
  "mss>=10,<11",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pyinstaller>=6.11,<7", "ruff>=0.11,<1"]

[project.scripts]
qa-narrator = "qa_narrator.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qa_narrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

